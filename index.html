<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RD App - Mehsana</title>
<style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f1f5f9;padding:10px}.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{flex:1;padding:12px 5px;border:0;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;background:#e2e8f0}.tabs button.active{background:#1e40af;color:#fff}.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}label{display:block;font-weight:700;font-size:13px;color:#334155;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.row{display:flex;gap:10px}.row>div{flex:1}.btn{width:100%;background:#1e40af;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:16px;margin-top:16px;cursor:pointer}.btn2{flex:1;padding:10px;border:0;border-radius:8px;font-weight:700;color:#fff;cursor:pointer;font-size:13px}.btnWA{width:100%;background:#25D366;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer}.cust{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin-top:10px}.small{font-size:12px;color:#64748b}.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}.red{background:#fee2e2;color:#b91c1c}.green{background:#dcfce7;color:#166534}.orange{background:#ffedd5;color:#9a3412}.del{color:red;background:none;border:0;float:right;font-weight:700}.suggest{border:1px solid #cbd5e1;border-radius:8px;max-height:220px;overflow:auto;display:none;background:#fff}.suggest div{padding:11px;border-bottom:1px solid #f1f5f9;cursor:pointer}.selected{background:#dcfce7;padding:10px;border-radius:8px;font-weight:700;font-size:14px;margin-top:8px;display:none}.backupBox{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:10px;margin-bottom:12px}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}.checkRow{display:flex;align-items:center;gap:8px;margin-top:12px;background:#f0fdf4;padding:10px;border-radius:8px}.checkRow input{width:20px;height:20px}.statBox{flex:1;padding:10px;border-radius:10px;text-align:center}.mBox{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.mBox label{margin:0;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}.mBox label:has(input:checked){background:#dcfce7;border-color:#16a34a}.mBox input{width:18px;height:18px;margin:0}</style></head><body>
<div class="backupBox"><b>🛡️ Data Backup - Roz Ek Baar Zaroor Karna</b><div style="display:flex;gap:8px;margin-top:8px"><button class="btn2" style="background:#16a34a" onclick="exportData()">⬇️ Backup Download</button><button class="btn2" style="background:#f59e0b" onclick="document.getElementById('importFile').click()">⬆️ Backup Wapas Lao</button><input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)"></div></div>
<div class="tabs"><button id="t1" class="active" onclick="showTab(1)">+ Add Customer</button><button id="t2" onclick="showTab(2)">₹ Jama Karo</button><button id="t3" onclick="showTab(3)">📄 Report</button><button id="t4" onclick="showTab(4)">⚠️ Baki Wale</button></div>
<div id="tab1" class="card"><label>Naam *</label><input id="f_name" placeholder="Jayeshkumar N Pandya"><label>Account No *</label><input id="f_ac" placeholder="020069003243"><label>CIF No</label><input id="f_cif" placeholder="Ex: 987654"><label>Mobile Number *</label><input id="f_mob" type="tel" placeholder="99796xxxxx"><label>Address</label><input id="f_addr" placeholder="Gaam nu naam"><div class="row"><div><label>Monthly RD *</label><input id="f_amt" type="number" placeholder="2000"></div><div><label>Start Date *</label><input id="f_start" type="date"></div></div><label>Due Date *</label><input id="f_due" type="number" placeholder="Ex: 17" min="1" max="31"><button class="btn" onclick="addCustomer()">Customer Save Karo</button><label>Customer List Me Khojo</label><input id="c_search" placeholder="Naam ya Account se khojo..." oninput="render()"><div id="list"></div></div>
<div id="tab2" class="card" style="display:none"><label>Customer Khojo - Naam Ya Account No Likho 🔍</label><input id="j_search" placeholder="Ex: Jitaben ya 0200..." oninput="filterCust()" autocomplete="off"><div id="j_suggest" class="suggest"></div><div id="j_selected" class="selected"></div><label>Kitna Jama Karna Hai? ₹ (1 Mahine Ka)</label><input id="j_amt" type="number" placeholder="2000"><label>Saal Chuno</label><select id="j_year"><option value="2026" selected>2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2027">2027</option></select><label>Mahine Tick Karo - Jitne Chahiye Utne ✅</label><div class="mBox"><label><input type="checkbox" class="mcheck" value="01"> Jan</label><label><input type="checkbox" class="mcheck" value="02"> Feb</label><label><input type="checkbox" class="mcheck" value="03"> Mar</label><label><input type="checkbox" class="mcheck" value="04"> Apr</label><label><input type="checkbox" class="mcheck" value="05"> May</label><label><input type="checkbox" class="mcheck" value="06"> Jun</label><label><input type="checkbox" class="mcheck" value="07"> Jul</label><label><input type="checkbox" class="mcheck" value="08"> Aug</label><label><input type="checkbox" class="mcheck" value="09"> Sep</label><label><input type="checkbox" class="mcheck" value="10"> Oct</label><label><input type="checkbox" class="mcheck" value="11"> Nov</label><label><input type="checkbox" class="mcheck" value="12"> Dec</label></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn2" style="background:#16a34a" onclick="tickAllMonths()">Sab Tick Karo</button><button class="btn2" style="background:#64748b" onclick="clearMonths()">Sab Hatavo</button></div><label>Cash / Cheque ?</label><select id="j_type" onchange="document.getElementById('j_check').style.display=this.value=='Cheque'?'block':'none'"><option value="Cash">Cash</option><option value="Cheque">Cheque</option></select><input id="j_check" placeholder="Cheque No. lakho" style="display:none;margin-top:8px"><div class="checkRow"><input type="checkbox" id="wa_check" checked><span>✅ Jama ke baad Customer ko WhatsApp Msg bhejo</span></div><button class="btn" onclick="addJama()">Jama Save Karo</button><div id="j_list"></div></div>
<div id="tab3" class="card" style="display:none"><h3 style="margin:0">📄 Account No. Likho - Pura Hisab Dikhega</h3><label>Account No. Ya Naam Likho</label><input id="r_search" placeholder="Ex: 020069003243" oninput="showReport()"><label>Saal Chuno</label><select id="r_year" onchange="showReport()"><option value="all">Pura Hisab - Sab Saal</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option></select><div id="reportBox"></div></div>
<div id="tab4" class="card" style="display:none"><h3 style="margin:0">Is Mahine Baki Wale</h3><label>Yaha Bhi Khojo</label><input id="b_search" placeholder="Naam se khojo..." oninput="render()"><div id="baki_list"></div></div><script>
let customers=JSON.parse(localStorage.getItem('rd_cust')||'[]');let jama=JSON.parse(localStorage.getItem('rd_jama')||'[]');let selectedId=null,lastJama=null;
customers.forEach(c=>{if(!c.id)c.id=Date.now().toString()+Math.floor(Math.random()*999)});jama.forEach((j,i)=>{if(j.cust!==undefined&&!j.custId){let cu=customers[j.cust];if(cu)j.custId=cu.id;}});
function save(){localStorage.setItem('rd_cust',JSON.stringify(customers));localStorage.setItem('rd_jama',JSON.stringify(jama));render();}
function showTab(n){[1,2,3,4].forEach(i=>{document.getElementById('tab'+i).style.display=n==i?'block':'none';document.getElementById('t'+i).className=n==i?'active':''});render();}
function uid(){return Date.now().toString()+Math.floor(Math.random()*1000);}
function tickAllMonths(){document.querySelectorAll('.mcheck').forEach(c=>c.checked=true);}
function clearMonths(){document.querySelectorAll('.mcheck').forEach(c=>c.checked=false);}
function addCustomer(){let c={id:uid(),name:document.getElementById('f_name').value.trim(),ac:document.getElementById('f_ac').value.trim(),cif:document.getElementById('f_cif').value.trim(),mob:document.getElementById('f_mob').value.trim(),addr:document.getElementById('f_addr').value.trim(),amt:+document.getElementById('f_amt').value,start:document.getElementById('f_start').value,due:document.getElementById('f_due').value};if(!c.name||!c.ac||!c.amt||!c.start||!c.due){alert('Naam, Account, Amount, Start Date aur Due Date sab bharo!');return;}customers.push(c);save();alert('Ho Gaya! '+c.name+' Save Ho Gaya.');['f_name','f_ac','f_cif','f_mob','f_addr','f_amt','f_start','f_due'].forEach(id=>document.getElementById(id).value='');}
function filterCust(){let q=document.getElementById('j_search').value.toLowerCase().trim();let box=document.getElementById('j_suggest');if(!q){box.style.display='none';return;}let f=customers.filter(c=>c.name.toLowerCase().includes(q)||c.ac.includes(q));if(!f.length){box.innerHTML='<div>Koi naam nahi mila</div>';box.style.display='block';return;}box.innerHTML=f.map(c=>`<div onclick="selectCust('${c.id}')"><b>${c.name}</b><br><span class="small">A/c: ${c.ac} | RD: ₹${c.amt} | Due: ${c.due} | Mob: ${c.mob||'No'}</span></div>`).join('');box.style.display='block';}
function selectCust(id){selectedId=id;let c=customers.find(x=>x.id==id);document.getElementById('j_search').value=c.name;document.getElementById('j_suggest').style.display='none';let sel=document.getElementById('j_selected');sel.style.display='block';sel.innerHTML='✅ Chuna Gaya: '+c.name+' - A/c: '+c.ac+' | RD: ₹'+c.amt;document.getElementById('j_amt').value=c.amt;}
function addJama(){let amt=+document.getElementById('j_amt').value;let year=document.getElementById('j_year').value;let type=document.getElementById('j_type').value;let check=document.getElementById('j_check').value;if(!selectedId){alert('Pehle customer chuno');return;}if(!amt){alert('Amount likho');return;}let ticked=[...document.querySelectorAll('.mcheck:checked')].map(c=>c.value);if(ticked.length==0){alert('Kam se kam 1 mahina tick karo!');return;}if(type=='Cheque'&&!check){alert('Cheque No. likho bhai!');return;}let c=customers.find(x=>x.id==selectedId);let todayStr=new Date().toLocaleDateString('en-GB');let monthsList=[];let skipped=[];ticked.forEach(m=>{let mm=year+'-'+m;let already=jama.some(j=>j.custId==selectedId&&j.month==mm);if(already){skipped.push(mm);return;}jama.push({custId:selectedId,amt,month:mm,date:todayStr,type,check});monthsList.push(mm);});if(monthsList.length==0){alert('Ye sab mahine pehle se jama hai');return;}lastJama={cust:c,amt:amt*monthsList.length,month:monthsList.join(', '),date:todayStr,type,check};save();let msg=monthsList.length+' Mahine ka Jama Ho Gaya! Total: ₹'+(amt*monthsList.length)+' - '+monthsList.join(', ');if(skipped.length)msg+='\nYe pehle se jama the, skip kiye: '+skipped.join(', ');alert(msg);if(document.getElementById('wa_check').checked&&c.mob&&c.mob.length>=10){sendLastWhatsApp();}document.getElementById('j_search').value='';document.getElementById('j_selected').style.display='none';document.getElementById('j_check').value='';clearMonths();selectedId=null;}
function sendLastWhatsApp(){if(!lastJama)return;let c=lastJama.cust;let mob=c.mob.replace(/[^0-9]/g,'');if(mob.length==10)mob='91'+mob;if(mob.startsWith('0'))mob='91'+mob.slice(1);let msg=`Namaste ${c.name} 🙏\n\nAapka RD paisa receive ho gaya hai.\n\n✅ Total Amount: Rs. ${lastJama.amt}\n📅 Date: ${lastJama.date}\n📅 Mahina: ${lastJama.month}\n💵 Type: ${lastJama.type} ${lastJama.check?'(Cheque No: '+lastJama.check+')':''}\n🏦 Account: ${c.ac}\n\nDhanyavaad!`;window.open(`https://wa.me/${mob}?text=${encodeURIComponent(msg)}`,'_blank');}
function showReport(){let q=document.getElementById('r_search').value.toLowerCase().trim();let year=document.getElementById('r_year').value;let box=document.getElementById('reportBox');if(!q){box.innerHTML='';return;}let c=customers.find(x=>x.ac.includes(q)||x.name.toLowerCase().includes(q));if(!c){box.innerHTML='<p style="color:red">❌ Account nahi mila</p>';return;}let list=jama.filter(j=>j.custId==c.id);if(year!=='all')list=list.filter(j=>j.month.startsWith(year));list=list.sort((a,b)=>a.month.localeCompare(b.month));let total=list.reduce((s,j)=>s+j.amt,0);let cashList=list.filter(j=>j.type=='Cash');let chequeList=list.filter(j=>j.type=='Cheque'||j.type=='Check');let cashTotal=cashList.reduce((s,j)=>s+j.amt,0);let chequeTotal=chequeList.reduce((s,j)=>s+j.amt,0);let rows=list.map(j=>`<tr><td>${j.date}</td><td>${j.month}</td><td>₹${j.amt}</td><td><span class="badge ${j.type=='Cash'?'green':'orange'}">${j.type=='Check'?'CHEQUE':j.type.toUpperCase()} ${j.check?'- '+j.check:''}</span></td></tr>`).join('')||'<tr><td colspan="4">Abhi koi Jama nahi</td></tr>';box.innerHTML=`<hr><b>${c.name}</b><br><span class="small">A/c: ${c.ac} | CIF: ${c.cif||'-'} | Mob: ${c.mob||'-'}<br>RD: ₹${c.amt} | Due: ${c.due} Tarikh | Address: ${c.addr||'-'}</span><div style="display:flex;gap:8px;margin-top:10px"><div class="statBox" style="background:#dcfce7"><b style="color:#166534">💵 CASH</b><br><b>₹${cashTotal}</b><br><span class="small">${cashList.length} baar</span></div><div class="statBox" style="background:#ffedd5"><b style="color:#9a3412">🏦 CHEQUE</b><br><b>₹${chequeTotal}</b><br><span class="small">${chequeList.length} baar</span></div><div class="statBox" style="background:#dbeafe"><b>TOTAL</b><br><b>₹${total}</b><br><span class="small">${list.length} Entry</span></div></div><table><tr><th>Date</th><th>Mahina</th><th>Amount</th><th>Cash / Cheque</th></tr>${rows}</table><button class="btnWA" onclick="sendReportWA('${c.id}')">📲 Ye Report WhatsApp Pe Bhejo</button>`;}
function sendReportWA(id){let c=customers.find(x=>x.id==id);let list=jama.filter(j=>j.custId==id).sort((a,b)=>a.month.localeCompare(b.month));let total=list.reduce((s,j)=>s+j.amt,0);let cashTotal=list.filter(j=>j.type=='Cash').reduce((s,j)=>s+j.amt,0);let chequeTotal=list.filter(j=>j.type=='Cheque'||j.type=='Check').reduce((s,j)=>s+j.amt,0);let lines=list.map(j=>`${j.date} - ${j.month} - ₹${j.amt} - ${j.type} ${j.check?j.check:''}`).join('\n');let mob=c.mob.replace(/[^0-9]/g,'');if(mob.length==10)mob='91'+mob;let msg=`RD REPORT - ${c.name}\nA/c: ${c.ac}\nCash Total: ₹${cashTotal}\nCheque Total: ₹${chequeTotal}\nTotal Paid: ₹${total}\n\n${lines}\n\nDhanyavaad!`;window.open(`https://wa.me/${mob}?text=${encodeURIComponent(msg)}`,'_blank');}
function delCust(id){if(confirm('Pakka delete karna hai?')){customers=customers.filter(c=>c.id!=id);jama=jama.filter(j=>j.custId!=id);save();}}
function exportData(){let data={customers,jama,date:new Date().toLocaleString()};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RD-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();alert('Backup Download Ho Gaya!');}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(){try{let d=JSON.parse(r.result);if(d.customers){customers=d.customers;jama=d.jama||[];save();alert('Data Wapas Aa Gaya! Total: '+customers.length);}}catch(err){alert('File kharab hai');}};r.readAsText(file);}
function render(){let cq=(document.getElementById('c_search')?.value||'').toLowerCase();let html='';customers.forEach(c=>{if(cq&&!c.name.toLowerCase().includes(cq)&&!c.ac.includes(cq))return;html+=`<div class="cust"><button class="del" onclick="delCust('${c.id}')">X</button><b>${c.name}</b><br><span class="small">A/c: ${c.ac} | CIF: ${c.cif||'-'} | Mob: ${c.mob||'-'}<br>RD: ₹${c.amt} | Start: ${c.start} | <b>Due: ${c.due} Tarikh</b></span></div>`;});document.getElementById('list').innerHTML=html||'<p class="small">Abhi koi customer nahi</p>';let jhtml='';jama.slice().reverse().slice(0,20).forEach(j=>{let cu=customers.find(c=>c.id==j.custId);jhtml+=`<div class="cust"><b>${cu?cu.name:'Deleted'}</b> - ₹${j.amt} <span class="small">(${j.month} | ${j.date}) - ${j.type||'Cash'} ${j.check||''}</span></div>`;});document.getElementById('j_list').innerHTML=jhtml;let today=new Date();let curMonth=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');let bq=(document.getElementById('b_search')?.value||'').toLowerCase();let bhtml='';customers.forEach(c=>{if(bq&&!c.name.toLowerCase().includes(bq)&&!c.ac.includes(bq))return;let paid=jama.some(j=>j.custId==c.id&&j.month==curMonth);let dueDay=parseInt(c.due)||1;let dueDate=new Date(today.getFullYear(),today.getMonth(),dueDay);let status=paid?'<span class="badge green">JAMA HO GAYA</span>':(today>dueDate?'<span class="badge red">BAKI - DUE NIKAL GAYA</span>':'<span class="badge orange">BAKI</span>');bhtml+=`<div class="cust"><b>${c.name}</b> - ₹${c.amt}<br><span class="small">Due: ${dueDay} Tarikh | ${status}</span><br><button class="btn" style="padding:8px;font-size:13px;margin-top:8px" onclick="showTab(2);selectCust('${c.id}')">Iska Jama Karo</button></div>`;});document.getElementById('baki_list').innerHTML=bhtml||'<p>Abhi koi customer nahi</p>';}
render();
</script></body></html>
